name: Enregistrer les voix

# 1. Prononciations de vrais locuteurs (Lingua Libre, Wikimedia Commons, CC BY-SA).
# 2. Voix neuronales Google pour ce qui manque encore (secret GOOGLE_TTS_API_KEY).
# Se lance à la demande ou dès qu'un cours change sur main, puis valide et pousse.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Réenregistrer toutes les voix Google (par exemple après un changement de voix)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["courses/**/course.json", "courses/voices.json"]

concurrency: voices

jobs:
  voices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg (conversion des enregistrements en MP3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Vrais locuteurs (Lingua Libre)
        run: npm run recordings
      - name: Voix neuronales Google
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_API_KEY" ]; then
            echo "::warning::Le secret GOOGLE_TTS_API_KEY manque (Settings > Secrets and variables > Actions) : les éléments sans enregistrement gardent la voix du téléphone."
            exit 0
          fi
          npm run audio -- ${{ inputs.force && '--force' || '' }}
      - run: npm run validate
      - name: Pousser les enregistrements
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Rien de nouveau."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses
          git commit -m "Enregistrer les voix"
          git push
